<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link
        href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css'
        rel='stylesheet'
        integrity='sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB' 
        crossorigin='anonymous'
    >
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css'>
    <link rel='stylesheet' href='/css/style.css'>
    <style>
        :root {
            --bs-body-font-family: 'Helvetica';
        }
    </style>
    <title>Daily Art</title>
	<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js'></script>
    <script type='module' src='/src/app.js'></script>
</head>

<div class='modal fade' id='artwork-modal' tabindex='-1'>
	<div class='modal-dialog modal-lg modal-dialog-centered'>
		<div class='modal-content'>

            <div class='modal-header border-0'>
                <button type='button' class='btn-close' data-bs-dismiss='modal'></button>
            </div>

			<div class='modal-body'>
                <div class='row align-items-center'>
                    <div class="col-md-6 text-center">
                        <img id='modal-artwork' class='img-fluid mb-3'>
                    </div>
                    <div class="col-md-6 d-flex flex-column justify-content-center text-start">
                        <h2 id='modal-artist' class='fw-bold'></h2>
                        <h2>
                            <span class='fw-bold fst-italic' id='modal-title'></span>
                            <span id='modal-date'></span>
                        </h2>
                        <p class='fs-4' id='modal-medium'></p>
                        <button id='modal-heart-button' class='btn p-0 border-0'>
                            <i id='modal-heart-icon' class='bi bi-heart fs-2'></i>
                        </button>
                    </div>
                </div>
			</div>
            
		</div>
  	</div>
</div>

<body class='d-flex flex-column vh-100'>
    
    <nav class='navbar navbar-expand-lg bg-body-tertiary'>
        <div class='container-fluid'>
            <a class='navbar-brand' href='#' id='artifact-page'>ArtiFact</a>
            <button class='navbar-toggler' type='button' data-bs-toggle='collapse' data-bs-target='#navbarNavAltMarkup' aria-controls='navbarNavAltMarkup' aria-expanded='false' aria-label='Toggle navigation'>
                <span class='navbar-toggler-icon'></span>
            </button>
            <div class='collapse navbar-collapse' id='navbarNavAltMarkup'>
                <div class='navbar-nav'>
                    <a class='nav-link' href='#' id='liked-page'>
                        <i class='bi bi-heart-fill'></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div id='content' class='container d-flex justify-content-center align-items-center flex-grow-1'></div>
    
</body>

</html>
