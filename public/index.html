<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    >
    <title>Daily Art</title>
    <script>
        fetch('/current-artwork')
            .then(response => response.json())
            .then(data => {
                const artworkUrl = data.artworkUrl;
                document.getElementById('current-artwork').src = artworkUrl;
            })
            .catch(err => console.error("Failed to fetch artwork:", err));
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ArtiFact</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="#">Liked</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-grow-1 text-center justify-content-around align-items-center">
        <div class="row w-100">
            <div class="col">
                <img id="current-artwork" alt="Daily Artwork" />
            </div>
            <div class="col">
                The metadata shall go here
            </div>
        </div>
    </div>
</body>

</html>
