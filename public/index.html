<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    >
    <style>
        :root {
            --bs-body-font-family: "Helvetica";
        }
    </style>
    <title>Daily Art</title>
    <script>
        fetch('/current-artwork')
            .then(response => response.json())
            .then(data => {
                const img = document.getElementById('current-artwork');
                const artworkUrl = data.url;
                const artist = data.artist_title;
                const title = data.title;
                const date = data.date_display;
                const medium = data.artwork_type_title;
                const artist_date = data.artist_display;
                
                img.src = artworkUrl;
                document.getElementById('artist').textContent = artist;
                document.getElementById('title').textContent = `${title},`;
                document.getElementById('date').textContent = date;
                document.getElementById('medium').textContent = medium;
                document.getElementById('artist_date').textContent = `(${artist_date})`;
            })
            .catch(err => console.error("Failed to fetch artwork:", err));
    </script>
</head>

<body class="d-flex flex-column vh-100">
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ArtiFact</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="#">Liked</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="d-flex container flex-grow-1">
        <div class="row h-100 align-items-center justify-content-center">
            <div class="col-auto">
                <img class="img-fluid" id="current-artwork" style="max-height: 80vh; object-fit: contain;" alt="Daily Artwork" />
            </div>
            <div class="col-auto text-start d-flex flex-column justify-content-center">
                <h2 id="artist" class="fw-bold"></h2>
                <h2>
                    <span class="fw-bold fst-italic" id="title"></span>
                    <span id="date"></span>
                </h2>
                <p class="fs-4" id="medium"></p>
            </div>
        </div>
    </div>
</body>

</html>
